CPUMIN=250000
GOVERNOR="ondemand"
CPUFREQUTILS_ENABLE=true
BOOTSCRIPT="boot-jethub.cmd:boot.cmd"
BOOTBRANCH="tag:v2023.10"
BOOTPATCHDIR="v2023.10"

